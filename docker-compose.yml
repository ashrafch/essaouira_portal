services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: essa
      POSTGRES_USER: essa
      POSTGRES_PASSWORD: essa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U essa -d essa"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://essa:essa@db:5432/essa
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      AUTH_ENABLED: "true"
      AUTH_SECRET_KEY: change-me-strong-secret
      ADMIN_USERNAME: owner
      ADMIN_PASSWORD: owner123
      AUTO_CREATE_SCHEMA: "true"
      AUTO_SEED_DATA: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["ops"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:11.2.2
    profiles: ["ops"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  db-backup:
    image: postgres:16-alpine
    profiles: ["ops"]
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: essa
      POSTGRES_USER: essa
      POSTGRES_PASSWORD: essa
      BACKUP_INTERVAL_HOURS: "24"
      BACKUP_RETENTION_DAYS: "7"
    volumes:
      - ./scripts/db-backup.sh:/usr/local/bin/db-backup.sh:ro
      - db_backups:/backups
    entrypoint: ["/bin/sh", "/usr/local/bin/db-backup.sh"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  grafana_data:
  db_backups:
