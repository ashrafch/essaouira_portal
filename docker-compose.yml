name: essaouira-portal

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-essa}
      POSTGRES_USER: ${POSTGRES_USER:-essa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-essa}
    ports:
      # Bound to loopback only: the database is never exposed on the LAN.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-essa} -d ${POSTGRES_DB:-essa}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-essa}:${POSTGRES_PASSWORD:-essa}@db:5432/${POSTGRES_DB:-essa}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:${WEB_PORT:-8081},http://127.0.0.1:${WEB_PORT:-8081},http://localhost:8080,http://127.0.0.1:8080}
      AUTH_ENABLED: "true"
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-change-me-strong-secret}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-owner}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-owner123}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
      AUTO_CREATE_SCHEMA: ${AUTO_CREATE_SCHEMA:-true}
      AUTO_SEED_DATA: ${AUTO_SEED_DATA:-true}
      SMART_PROVIDER_MODE: ${SMART_PROVIDER_MODE:-mock}
      HOME_ASSISTANT_URL: ${HOME_ASSISTANT_URL:-}
      HOME_ASSISTANT_TOKEN: ${HOME_ASSISTANT_TOKEN:-}
      HOME_ASSISTANT_TIMEOUT_SECONDS: ${HOME_ASSISTANT_TIMEOUT_SECONDS:-10}
      HOME_ASSISTANT_INCLUDE_DOMAINS: ${HOME_ASSISTANT_INCLUDE_DOMAINS:-binary_sensor,sensor,switch,climate,input_boolean,input_number}
      HOME_ASSISTANT_UNIT_HINTS: ${HOME_ASSISTANT_UNIT_HINTS:-{}}
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Loopback only: LAN clients reach the API through the web proxy (/api).
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Bound on all interfaces: reachable from the LAN at http://<host-ip>:WEB_PORT
      - "${WEB_PORT:-8081}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["ops"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:11.2.2
    profiles: ["ops"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

  db-backup:
    image: postgres:16-alpine
    profiles: ["ops"]
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-essa}
      POSTGRES_USER: ${POSTGRES_USER:-essa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-essa}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - ./scripts/db-backup.sh:/usr/local/bin/db-backup.sh:ro
      - db_backups:/backups
    entrypoint: ["/bin/sh", "/usr/local/bin/db-backup.sh"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  grafana_data:
  db_backups:
