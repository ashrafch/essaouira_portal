[pytest]
testpaths = tests
# Make `app` importable when CI runs the bare `pytest` command (which, unlike
# `python -m pytest`, does not add the working directory to sys.path).
pythonpath = .
addopts = -q
filterwarnings =
    error::pydantic.warnings.PydanticDeprecatedSince20
    error:.*on_event is deprecated.*:DeprecationWarning
