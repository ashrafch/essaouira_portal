name: Staging Pipeline

on:
  workflow_dispatch:

jobs:
  staging-migrations-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: essa
          POSTGRES_USER: essa
          POSTGRES_PASSWORD: essa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U essa -d essa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: alembic -c alembic.ini upgrade head
        env:
          DATABASE_URL: postgresql+psycopg2://essa:essa@localhost:5432/essa

  staging-compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.yml -f docker-compose.staging.yml config
      - run: docker compose -f docker-compose.yml -f docker-compose.staging.yml build
